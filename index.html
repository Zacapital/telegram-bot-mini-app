<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Community Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            color: #1e1b4b;
            margin: 0;
            padding: 16px;
        }
        .lang-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .lang-selector button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background-color: #ffffff;
            color: #4f46e5;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.1);
            transition: all 0.2s;
        }
        .lang-selector button:active {
            transform: scale(0.95);
            background-color: #4f46e5;
            color: #ffffff;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 6px;
            color: #312e81;
        }
        p {
            color: #6366f1;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Til tanlash paneli -->
    <div class="lang-selector">
        <button onclick="setLanguage('uz')">🇺🇿 O'zbek</button>
        <button onclick="setLanguage('ru')">🇷🇺 Русский</button>
        <button onclick="setLanguage('en')">🇬🇧 English</button>
    </div>

    <!-- Sarlavha va Tavsif -->
    <h1 id="main-title">Xush kelibsiz!</h1>
    <p id="main-desc">Treyding jamiyatimizga xush kelibsiz.</p>

<script>
const translations = {
    uz: {
        mainTitle: "Xush kelibsiz!",
        mainDesc: "Treyding jamiyatimizga xush kelibsiz."
    },
    ru: {
        mainTitle: "Добро пожаловать!",
        mainDesc: "Добро пожаловать в наше трейдинг сообщество."
    },
    en: {
        mainTitle: "Welcome!",
        mainDesc: "Welcome to our trading community."
    }
};

function setLanguage(lang) {
    localStorage.setItem('selectedLang', lang);
    const t = translations[lang];
    
    document.getElementById('main-title').innerText = t.mainTitle;
    document.getElementById('main-desc').innerText = t.mainDesc;
}

window.onload = () => {
    const savedLang = localStorage.getItem('selectedLang') || 'uz';
    setLanguage(savedLang);
};
</script>

</body>
</html>
