<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Community Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            color: #1e1b4b;
            margin: 0;
            padding: 16px;
        }
        .lang-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .lang-selector button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background-color: #ffffff;
            color: #4f46e5;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.1);
            transition: all 0.2s;
        }
        .lang-selector button:active {
            transform: scale(0.95);
            background-color: #4f46e5;
            color: #ffffff;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 6px;
            color: #312e81;
        }
        p {
            color: #6366f1;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .menu-card {
            background-color: #ffffff;
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.08);
            text-decoration: none;
            color: #1e1b4b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .menu-card:active {
            transform: scale(0.98);
        }
        .menu-card-title {
            font-size: 16px;
            font-weight: 700;
            color: #4f46e5;
        }
        .menu-card-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background-color: #e0e7ff;
            color: #4f46e5;
        }
        .menu-card-badge.soon {
            background-color: #f3f4f6;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <!-- Til tanlash paneli -->
    <div class="lang-selector">
        <button onclick="setLanguage('uz')">🇺🇿 O'zbek</button>
        <button onclick="setLanguage('ru')">🇷🇺 Русский</button>
        <button onclick="setLanguage('en')">🇬🇧 English</button>
    </div>

    <!-- Sarlavha va Tavsif -->
    <h1 id="main-title">Xush kelibsiz!</h1>
    <p id="main-desc">Treyding jamiyatimizga xush kelibsiz.</p>

    <!-- Asosiy Bo'limlar -->
    <div class="menu-container">
        <a href="#" class="menu-card">
            <span class="menu-card-title" id="btn-qt">QT Community</span>
            <span class="menu-card-badge" id="badge-join">Obunani faollashtirish</span>
        </a>
        <a href="#" class="menu-card">
            <span class="menu-card-title" id="btn-signals">Signal Channel</span>
            <span class="menu-card-badge" id="badge-view">Obunani faollashtirish</span>
        </a>
        <a href="#" class="menu-card" style="opacity: 0.8;">
            <span class="menu-card-title" id="btn-mentorship">Mentorship</span>
            <span class="menu-card-badge soon" id="badge-soon">Tez kunda</span>
        </a>
    </div>

<script>
const translations = {
    uz: {
        mainTitle: "Xush kelibsiz!",
        mainDesc: "Treyding jamiyatimizga xush kelibsiz.",
        btnQt: "QT Community",
        btnSignals: "Signal Channel",
        btnMentorship: "Mentorship",
        badgeJoin: "Obunani faollashtirish",
        badgeView: "Obunani faollashtirish",
        badgeSoon: "Tez kunda"
    },
    ru: {
        mainTitle: "Добро пожаловать!",
        mainDesc: "Добро пожаловать в наше трейдинг сообщество.",
        btnQt: "QT Community (Закрытый Клуб)",
        btnSignals: "VIP Signal Channel 🔥",
        btnMentorship: "Mentorship (Pro)",
        badgeJoin: "Активировать подписку",
        badgeView: "Активировать подписку",
        badgeSoon: "Скоро"
    },
    en: {
        mainTitle: "Welcome!",
        mainDesc: "Welcome to our trading community.",
        btnQt: "QT Community",
        btnSignals: "Signal Channel",
        btnMentorship: "Mentorship",
        badgeJoin: "Activate subscription",
        badgeView: "Activate subscription",
        badgeSoon: "Soon"
    }
};

function setLanguage(lang) {
    localStorage.setItem('selectedLang', lang);
    const t = translations[lang];
    
    document.getElementById('main-title').innerText = t.mainTitle;
    document.getElementById('main-desc').innerText = t.mainDesc;
    document.getElementById('btn-qt').innerText = t.btnQt;
    document.getElementById('btn-signals').innerText = t.btnSignals;
    document.getElementById('btn-mentorship').innerText = t.btnMentorship;
    document.getElementById('badge-join').innerText = t.badgeJoin;
    document.getElementById('badge-view').innerText = t.badgeView;
    document.getElementById('badge-soon').innerText = t.badgeSoon;
}

window.onload = () => {
    const savedLang = localStorage.getItem('selectedLang') || 'uz';
    setLanguage(savedLang);
};
</script>

</body>
</html>
